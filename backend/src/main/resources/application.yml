
server:
  port: 8080

spring:
  application:
    name: file-upload-service
  
  datasource:
    url: jdbc:h2:mem:fileupload;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  
  servlet:
    multipart:
      enabled: true
      max-file-size: 5GB
      max-request-size: 5GB

# 文件存储配置
file:
  upload-dir: ./uploads
  temp-dir: ./temp
  allowed-extensions:
    - .txt
    - .pdf
    - .doc
    - .docx
    - .xls
    - .xlsx
    - .ppt
    - .pptx
    - .zip
    - .rar
    - .tar
    - .gz
    - .jpg
    - .jpeg
    - .png
    - .gif
    - .safetensors
